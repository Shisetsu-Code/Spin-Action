name: Runner Provisioning Probe

on:
  push:
    branches:
      - lab/actions-validation
    paths:
      - .github/workflows/runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner assigned
        run: |
          echo "runner=ubuntu-latest"
          uname -a

  ubuntu-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Runner assigned
        run: |
          echo "runner=ubuntu-slim"
          uname -a
