name: Provider Validation Lab

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider key
        required: true
        default: pragmatic
        type: choice
        options:
          - pragmatic
          - belatra
          - 1spin4win
          - rubyplay
          - redtiger
          - bgaming
      slug:
        description: Exact game slug; blank uses offset
        required: false
        default: ''
        type: string
      game_offset:
        description: Sorted catalog offset
        required: true
        default: '0'
        type: string
      game_limit:
        description: Number of games
        required: true
        default: '1'
        type: string
      spins:
        description: Repetitions per path
        required: true
        default: '1'
        type: string
      timeout:
        description: Timeout seconds
        required: true
        default: '45'
        type: string
      max_pages:
        description: Catalog pages; 0 means full catalog
        required: true
        default: '1'
        type: string
      allow_har_fallback:
        description: Allow HAR preparation/capture only when explicitly requested
        required: true
        default: false
        type: boolean
  push:
    branches:
      - lab/actions-validation
    paths:
      - '.github/provider-validation.json'
      - '.github/workflows/provider-validation.yml'

permissions:
  contents: read

concurrency:
  group: provider-validation-lab
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve validation configuration
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_GAME_OFFSET: ${{ inputs.game_offset }}
          INPUT_GAME_LIMIT: ${{ inputs.game_limit }}
          INPUT_SPINS: ${{ inputs.spins }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_ALLOW_HAR: ${{ inputs.allow_har_fallback }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              cfg = {
                  'provider': os.environ.get('INPUT_PROVIDER') or 'pragmatic',
                  'slug': os.environ.get('INPUT_SLUG') or '',
                  'game_offset': int(os.environ.get('INPUT_GAME_OFFSET') or 0),
                  'game_limit': int(os.environ.get('INPUT_GAME_LIMIT') or 1),
                  'spins': int(os.environ.get('INPUT_SPINS') or 1),
                  'timeout': float(os.environ.get('INPUT_TIMEOUT') or 45),
                  'max_pages': int(os.environ.get('INPUT_MAX_PAGES') or 1),
                  'allow_har_fallback': str(os.environ.get('INPUT_ALLOW_HAR') or '').lower() == 'true',
              }
          else:
              cfg = json.loads(Path('.github/provider-validation.json').read_text(encoding='utf-8'))

          allowed = {'pragmatic', 'belatra', '1spin4win', 'rubyplay', 'redtiger', 'bgaming'}
          if cfg.get('provider') not in allowed:
              raise SystemExit(f"unsupported provider: {cfg.get('provider')!r}")
          if int(cfg.get('game_limit', 1)) < 1:
              raise SystemExit('game_limit must be >= 1 in live Actions validation')
          if int(cfg.get('max_pages', 1)) < 0:
              raise SystemExit('max_pages must be >= 0')

          values = {
              'provider': cfg['provider'],
              'slug': str(cfg.get('slug') or ''),
              'game_offset': int(cfg.get('game_offset', 0)),
              'game_limit': int(cfg.get('game_limit', 1)),
              'spins': int(cfg.get('spins', 1)),
              'timeout': float(cfg.get('timeout', 45)),
              'max_pages': int(cfg.get('max_pages', 1)),
              'allow_har_fallback': 'true' if cfg.get('allow_har_fallback') else 'false',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'{key}={value}', file=out)
          print(json.dumps(values, ensure_ascii=False, indent=2))
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for provider bootstrap
        run: python -m playwright install --with-deps chromium

      - name: Run fail-closed provider probe
        shell: bash
        run: |
          args=(
            --provider "${{ steps.config.outputs.provider }}"
            --slug "${{ steps.config.outputs.slug }}"
            --game-offset "${{ steps.config.outputs.game_offset }}"
            --game-limit "${{ steps.config.outputs.game_limit }}"
            --spins "${{ steps.config.outputs.spins }}"
            --timeout "${{ steps.config.outputs.timeout }}"
            --max-pages "${{ steps.config.outputs.max_pages }}"
            --data-root action-results/data
            --output-dir action-results
          )
          if [[ "${{ steps.config.outputs.allow_har_fallback }}" == "true" ]]; then
            args+=(--allow-har-fallback)
          fi
          python -m scripts.actions_provider_probe "${args[@]}"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-validation-${{ steps.config.outputs.provider }}-${{ github.run_id }}
          path: action-results/
          if-no-files-found: warn
          retention-days: 7
