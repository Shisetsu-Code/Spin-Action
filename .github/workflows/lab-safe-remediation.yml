name: Lab Safe Remediation

on: push

permissions:
  contents: write

jobs:
  patch-and-test:
    if: startsWith(github.event.head_commit.message, 'chore: execute BGaming remediation')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/actions-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply remediation
        run: python .github/scripts/bgaming_safe_remediate.py
      - name: Targeted regression tests
        run: |
          python -m unittest -v \
            tests.test_bgaming_adapter.BGamingAdapterContractTests.test_level_selector_drives_effective_bet_and_purchase_level \
            tests.test_bgaming_adapter.BGamingAdapterContractTests.test_unexplained_bet_translation_cannot_be_ok \
            tests.test_bgaming_hyperhive.BGamingHyperHiveTests.test_bling_blitz_discovers_custom_req_engine_profile \
            tests.test_bgaming_hyperhive_wire.BGamingHyperHiveWireTests.test_observed_serializer_does_not_replace_legacy_pz_profile \
            tests.test_bgaming_hyperhive_wire.BGamingHyperHiveWireTests.test_no_observed_serializer_keeps_legacy_profile
      - name: Full unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tester_spin/providers/bgaming/execution.py tester_spin/providers/bgaming/hyperhive_wire.py tests/test_bgaming_hyperhive_wire.py .github/provider-validation.json
          git commit -m "fix: preserve BGaming wager and HyperHive fail-closed authority"
          git push origin HEAD:lab/actions-validation
