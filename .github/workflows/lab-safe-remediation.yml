name: Lab Safe Remediation

on:
  push:
    branches: [lab/actions-validation]
    paths:
      - .github/workflows/lab-safe-remediation.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/actions-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply fail-closed BGaming remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('tester_spin/providers/bgaming/execution.py')
          s = p.read_text(encoding='utf-8')
          old = '''                                allow_observed_effective_bet=(
                                    mode_id == "SPIN"
                                    and not isinstance(purchase, dict)
                                    and observed_base_bet_multiplier == 1.0
                                ),'''
          new = '''                                allow_observed_effective_bet=(
                                    mode_id == "SPIN"
                                    and not isinstance(purchase, dict)
                                    and observed_base_bet_multiplier == 1.0
                                    and active_profile is not None
                                    and bool(active_profile.spin_options)
                                ),'''
          assert old in s, 'effective-bet authority block not found'
          s = s.replace(old, new, 1)

          old = '''                            if (
                                isinstance(actual_base_bet, (int, float))
                                and actual_base_bet > 0
                                and float(default_bet) > 0
                            ):
                                learned_ratio = float(actual_base_bet) / float(default_bet)
                                if abs(learned_ratio - 1.0) > 1e-9:'''
          new = '''                            if (
                                isinstance(actual_base_bet, (int, float))
                                and actual_base_bet > 0
                                and isinstance(expected_outcome_bet, (int, float))
                                and float(expected_outcome_bet) > 0
                            ):
                                # Learn only the residual multiplier not already
                                # explained by a provider/client selector contract.
                                # This prevents double-applying explicit effective-bet
                                # tables while still allowing a structurally proven
                                # mode/rows option to establish a server wager scale.
                                learned_ratio = (
                                    float(actual_base_bet) / float(expected_outcome_bet)
                                )
                                if abs(learned_ratio - 1.0) > 1e-9:'''
          assert old in s, 'effective-bet learning block not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tester_spin/providers/bgaming/hyperhive_wire.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if not profile.custom_req:
        return
    mode["custom_req_profile"] = profile.custom_profile'''
          new = '''    if not profile.custom_req:
        return
    # A pre-existing serializer profile is stronger than a later generic
    # formatted-custom_req observation. Never replace proven legacy wire shape
    # without evidence that the old profile is invalid.
    if str(mode.get("custom_req_profile") or ""):
        return
    mode["custom_req_profile"] = profile.custom_profile'''
          assert old in s, 'HyperHive profile precedence block not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_bgaming_hyperhive_wire.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def test_observed_serializer_replaces_legacy_pz_profile(self) -> None:
        mode = {
            "id": "SPIN",
            "kind": "SPIN",
            "executable": True,
            "custom_req_profile": "pz-per-line",
            "discovery_state": "BASE_CONTRACT",
            "source": "engine-heuristic",
        }
        profile = ObservedHyperHiveWire(
            custom_req=True,
            custom_action=True,
            custom_exponent=True,
            custom_stake_on_spin=True,
            custom_literals={"isNormalBuy": False},
        )
        _apply_observed_custom_profile_to_base_mode(mode, profile)
        self.assertEqual(mode["custom_req_profile"], "observed-formatted-stake")
        self.assertEqual(mode["custom_req_literal_keys"], ["isNormalBuy"])
        self.assertEqual(mode["discovery_state"], "OBSERVED_ENGINE_CONTRACT")
        self.assertEqual(mode["source"], "live-inner-client+engine-contract")
'''
          new = '''    def test_observed_serializer_does_not_replace_legacy_pz_profile(self) -> None:
        mode = {
            "id": "SPIN",
            "kind": "SPIN",
            "executable": True,
            "custom_req_profile": "pz-per-line",
            "discovery_state": "BASE_CONTRACT",
            "source": "engine-heuristic",
        }
        profile = ObservedHyperHiveWire(
            custom_req=True,
            custom_action=True,
            custom_exponent=True,
            custom_stake_on_spin=True,
            custom_literals={"isNormalBuy": False},
        )
        _apply_observed_custom_profile_to_base_mode(mode, profile)
        self.assertEqual(mode["custom_req_profile"], "pz-per-line")
        self.assertNotIn("custom_req_literal_keys", mode)
        self.assertEqual(mode["discovery_state"], "BASE_CONTRACT")
        self.assertEqual(mode["source"], "engine-heuristic")
'''
          assert old in s, 'HyperHive regression test block not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          cfg = Path('.github/provider-validation.json')
          data = json.loads(cfg.read_text(encoding='utf-8'))
          data['run_sequence'] = int(data.get('run_sequence') or 0) + 1
          data['slugs'] = 'dice-million,fortune-bells,burning-chilli-x,fishing-club,fishing-club-2,krakens-hunger,royal-fruits-multilines,wild-tiger'
          cfg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Targeted regression tests
        run: |
          python -m unittest -v \
            tests.test_bgaming_adapter.BGamingAdapterContractTests.test_level_selector_drives_effective_bet_and_purchase_level \
            tests.test_bgaming_adapter.BGamingAdapterContractTests.test_unexplained_bet_translation_cannot_be_ok \
            tests.test_bgaming_hyperhive.BGamingHyperHiveTests.test_bling_blitz_discovers_custom_req_engine_profile \
            tests.test_bgaming_hyperhive_wire.BGamingHyperHiveWireTests.test_observed_serializer_does_not_replace_legacy_pz_profile \
            tests.test_bgaming_hyperhive_wire.BGamingHyperHiveWireTests.test_no_observed_serializer_keeps_legacy_profile
      - name: Commit remediation
        shell: bash
        run: |
          rm .github/workflows/lab-safe-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tester_spin/providers/bgaming/execution.py tester_spin/providers/bgaming/hyperhive_wire.py tests/test_bgaming_hyperhive_wire.py .github/provider-validation.json .github/workflows/lab-safe-remediation.yml
          git commit -m 'fix: preserve BGaming wager and HyperHive fail-closed authority'
          git push origin HEAD:lab/actions-validation
